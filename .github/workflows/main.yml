name: Build and Test Sunamu

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Package (Linux)
    runs-on: ubuntu-latest
    env:
      SHARP_IGNORE_GLOBAL_LIBVIPS: "1"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libxss-dev libasound2-dev libnss3 libarchive-tools rpm

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: "1"

      - name: Run Linter
        run: npm run lint

      - name: Compile Application Code
        run: npm run build

      - name: Package Linux Desktop Application
        run: npx electron-builder --linux --x64 --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux Installers
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sunamu-linux-x64
          path: |
            targets/*.AppImage
            targets/*.deb
            targets/*.rpm
            targets/*.pacman
            targets/*.tar.xz
          if-no-files-found: ignore

      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: sunamu-web-build
          path: dist/
