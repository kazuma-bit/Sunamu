name: Build Sunamu Widget

on:
  workflow_dispatch: # Allows you to trigger the build manually with a button click

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18 # Lock into Node 18 which matches Sunamu's construction era

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libxss-dev libasound2-dev libnss3

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Compile Application Code
        run: npm run build

      - name: Bundle into Linux Installers
        run: npx electron-builder --linux --x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Finished App Installer
        uses: actions/upload-artifact@v4
        with:
          name: sunamu-linux-build
          path: |
            dist/*.AppImage
            dist/*.deb
            out/*.AppImage
            out/*.deb
