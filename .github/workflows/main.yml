name: Build Sunamu Widget

on:
  workflow_dispatch: 

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-size: 18 

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libxss-dev libasound2-dev

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Compile and Package App
        run: npm run package

      - name: Upload Finished App Installer
        uses: actions/upload-artifact@v4
        with:
          name: sunamu-linux-build
          path: |
            dist/*.AppImage
            dist/*.deb
            out/*.AppImage
            out/*.deb
